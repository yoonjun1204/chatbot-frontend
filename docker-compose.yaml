services:
  db:
    image: postgres:16
    container_name: chatbot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
      TZ: Asia/Singapore
      PGTZ: Asia/Singapore
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # optional: expose for pgAdmin / local tools

  rasa:
    image: rasa/rasa:3.6.20-full
    container_name: chatbot_rasa
    restart: unless-stopped
    working_dir: /app
    user: root #  Change to the root
    volumes:
      - ./rasa_bot:/app # your bot project (domain.yml, nlu.yml, etc.)
      #- rasa_models:/app/models  # named volume for trained models
    command: >
      run --enable-api --cors "*" --port 5005
    ports:
      - "5005:5005"

  action_server:
    #    image: rasa/rasa-sdk:3.6.2
    build:
      context: ./rasa_bot/actions
    container_name: chatbot_action_server
    restart: unless-stopped
    working_dir: /app
    #    user: root  # Same as rasa
    volumes:
      # Path
      - ./rasa_bot/actions:/app/actions
    ports:
      - "5055:5055"
    command:
      - start
      - --actions
      - actions
      - --debug

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: unless-stopped
    depends_on:
      - db
      - rasa
    volumes: # 👈 Add this section
      - ./backend:/app # Mount the local backend folder to the /app folder inside the container
    environment:
      DATABASE_URL: postgresql+psycopg2://chatbot_user:chatbot_password@db:5432/chatbot_db
      RASA_URL: http://rasa:5005/model/parse
      # Note: This needs to be changed to the new Webhook URL, ensuring the environment variables are correct.
      RASA_WEBHOOK_URL: http://rasa:5005/webhooks/rest/webhook
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_RASA_BASE_URL: http://localhost:5005
    container_name: chatbot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  rasa_models: # 👈 new named volume for Rasa models
