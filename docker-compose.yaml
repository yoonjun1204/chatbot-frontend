# docker-compose.yaml

services:
  # 🟢 1. RASA (The Slow Starter)
  rasa:
    image: rasa/rasa:3.6.20-full
    container_name: chatbot_rasa
    user: root
    volumes:
      - ./rasa_bot:/app
      - ./rasa_bot/models:/app/models
    ports:
      - "5005:5005"
    command: run --enable-api --cors "*" --debug
    depends_on:
      - action-server
    # ✅ HEALTHCHECK: Docker checks if Rasa is ready every 10s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # 🟢 2. ACTION SERVER
  action-server:
    build:
      context: ./rasa_bot
      dockerfile: Dockerfile
    container_name: chatbot_action_server
    volumes:
      - ./rasa_bot/actions:/app/actions
    ports:
      - "5055:5055"
    command: ["start", "--actions", "actions", "--port", "5055"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1 # Ensures logs are printed immediately
    # HEALTHCHECK: Ensures action server is up
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 🟢 3. BACKEND (Waits for Rasa)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # ⚠️ IMPORTANT: In your .env, this must be http://rasa:5005
      RASA_URL: ${RASA_URL}
      RASA_WEBHOOK_URL: ${RASA_WEBHOOK_URL}
      DB_USE_SSL: "true"
      PORT: 8000
    ports:
      - "8000:8000"
    # ✅ DEPENDS_ON: Backend will WAIT here until Rasa says "I am healthy"
    depends_on:
      rasa:
        condition: service_healthy
      action-server:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: chatbot_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
