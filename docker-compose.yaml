services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    volumes:
      - ./backend:/app
    environment:
      # These now pull from your updated .env file
      DATABASE_URL: ${DATABASE_URL}
      RASA_URL: ${RASA_URL}
      RASA_WEBHOOK_URL: ${RASA_WEBHOOK_URL}
      DB_USE_SSL: "true" # Neon requires SSL
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: chatbot_frontend
    ports:
      - "5173:80"
