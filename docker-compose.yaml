services:
  db:
    image: postgres:16
    container_name: chatbot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
      TZ: Asia/Singapore
      PGTZ: Asia/Singapore
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rasa:
    # --- CHANGE START: Use Dockerfile2 instead of raw image ---
    build:
      context: ./rasa_bot
      dockerfile: Dockerfile2
    # --- CHANGE END ---
    container_name: chatbot_rasa
    restart: unless-stopped
    working_dir: /app
    user: root 
    volumes:
      # Map local directory to container to sync files (including models)
      - ./rasa_bot:/app 
    # --- CHANGE START: Explicitly point to the models directory ---
    command: >
      run 
      -m models 
      --enable-api 
      --cors "*" 
      --port 5005 
      --debug
    # --- CHANGE END ---
    ports:
      - "5005:5005"

  action_server:
    build:
      context: ./rasa_bot
      dockerfile: Dockerfile
    container_name: chatbot_action_server
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./rasa_bot/actions:/app/actions
    ports:
      - "5055:5055"
    command:
      - start
      - --actions
      - actions
      - --debug

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    restart: unless-stopped
    depends_on:
      - db
      - rasa
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg2://chatbot_user:chatbot_password@db:5432/chatbot_db
      RASA_URL: http://rasa:5005/model/parse
      RASA_WEBHOOK_URL: http://rasa:5005/webhooks/rest/webhook
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_RASA_BASE_URL: http://localhost:5005
    container_name: chatbot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  # rasa_models: # Not needed if we mount ./rasa_bot:/app