# rasa_bot/data/rules.yml
version: "3.1"

rules:
  # =========================
  # Global / deterministic rules
  # =========================
  - rule: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_bot_identity

  - rule: Handle abusive language
    steps:
      - intent: abusive
      - action: utter_abusive_warning

  # =========================
  # Order status form
  # =========================
  - rule: Activate order status form
    steps:
      - intent: check_order_status
      - action: order_status_form
      - active_loop: order_status_form

  - rule: Activate order status form (Direct ID provided)
    steps:
      - intent: inform_order_id
      - action: order_status_form
      - active_loop: order_status_form

  - rule: Submit order status form
    condition:
      - active_loop: order_status_form
    steps:
      - action: order_status_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_check_order_status

  # --- NEW: Interruption Rule ---
  # Allows user to ask FAQ/Sales questions while stuck in the order form
  - rule: Interruption during Order Form
    condition:
      - active_loop: order_status_form
    steps:
      - intent: search_faq # Works for search_faq, ask_sales_advice, etc (if they share the rule structure)
      - action: action_deactivate_loop
      - active_loop: null
      - action: faq_search_form
      - active_loop: faq_search_form

  # =========================
  # FAQ search form
  # =========================
  - rule: Activate FAQ search form
    steps:
      - intent: search_faq
      - action: faq_search_form
      - active_loop: faq_search_form

  - rule: Submit FAQ search form
    condition:
      - active_loop: faq_search_form
    steps:
      - action: faq_search_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_faq

  - rule: Allow FAQ keyword during form
    condition:
      - active_loop: faq_search_form
    steps:
      - intent: inform_faq_query
      - action: faq_search_form
      - active_loop: faq_search_form

  # =========================
  # Form Corrections
  # =========================
  - rule: Allow order id correction during form
    condition:
      - active_loop: order_status_form
    steps:
      - intent: update_order_details
      - action: order_status_form
      - active_loop: order_status_form

  - rule: Allow order id info during form
    condition:
      - active_loop: order_status_form
    steps:
      - intent: inform_order_id
      - action: order_status_form
      - active_loop: order_status_form

  # =========================
  # Single Actions
  # =========================
  - rule: Respond to product info
    steps:
      - intent: product_info
      - action: utter_product_info

  - rule: Escalate to human agent
    steps:
      - intent: human_handover
      - action: utter_handover_ack
      - action: action_create_support_request
      - action: action_handover

  - rule: Rephrase prompt
    steps:
      - intent: rephrase
      - action: utter_rephrase_prompt

  - rule: Submit support request explicitly
    steps:
      - intent: submit_support_request
      - action: utter_ticket_ack
      - action: action_create_support_request
      - action: utter_ticket_created

  - rule: Activate Sales Brain
    steps:
      - intent: ask_sales_advice
      - action: action_sales_brain

  - rule: Ask Gemini when NLU is unsure
    steps:
      - intent: nlu_fallback
      - action: action_llm_fallback

  - rule: Respond to payment method inquiries
    steps:
      - intent: ask_payment_methods
      - action: action_search_faq

  - rule: Respond to returns policy
    steps:
      - intent: returns
      - action: action_search_faq
