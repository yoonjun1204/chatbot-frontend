# rasa_bot/data/rules.yml
version: "3.1"

rules:
  # =========================
  # Global / deterministic rules
  # =========================

  - rule: Greeting
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Bot challenge
    steps:
      - intent: bot_challenge
      - action: utter_bot_identity

  - rule: Handle abusive language
    steps:
      - intent: abusive
      - action: utter_abusive_warning

  - rule: Start a new chat (restart)
    steps:
      - intent: start_new_chat
      - action: utter_restart_ack
      - action: action_restart

  # =========================
  # Order status form
  # =========================

  - rule: Activate order status form
    steps:
      - intent: check_order_status
      - action: order_status_form
      - active_loop: order_status_form

  - rule: Submit order status form
    condition:
      - active_loop: order_status_form
    steps:
      - action: order_status_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_check_order_status

  # =========================
  # FAQ search form
  # =========================
  - rule: Activate FAQ search form
    steps:
      - intent: search_faq
      - action: faq_search_form
      - active_loop: faq_search_form

  - rule: Submit FAQ search form
    condition:
      - active_loop: faq_search_form
    steps:
      - action: faq_search_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_faq

  - rule: Allow FAQ keyword during form
    condition:
      - active_loop: faq_search_form
    steps:
      - intent: inform_faq_query
      - action: faq_search_form
      - active_loop: faq_search_form

  # =========================
  # History search form
  # =========================
  - rule: Activate history search form
    steps:
      - intent: search_chat_history
      - action: history_search_form
      - active_loop: history_search_form

  - rule: Submit history search form
    condition:
      - active_loop: history_search_form
    steps:
      - action: history_search_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_chat_history

  - rule: Allow history keyword during form
    condition:
      - active_loop: history_search_form
    steps:
      - intent: inform_history_query
      - action: history_search_form
      - active_loop: history_search_form

  # =========================
  # Form Corrections
  # =========================
  - rule: Allow order id correction during form
    condition:
      - active_loop: order_status_form
    steps:
      - intent: update_order_details
      - action: order_status_form
      - active_loop: order_status_form

  - rule: Allow order id info during form
    condition:
      - active_loop: order_status_form
    steps:
      - intent: inform_order_id
      - action: order_status_form
      - active_loop: order_status_form

  # =========================
  # Single Actions
  # =========================
  - rule: Respond to product info
    steps:
      - intent: product_info
      - action: utter_product_info

  - rule: Respond to returns policy
    steps:
      - intent: returns
      - action: utter_returns_policy

  # =========================
  # Human handover
  # =========================
  - rule: Escalate to human agent
    steps:
      - intent: human_handover
      - action: utter_handover_ack
      - action: action_create_support_request
      - action: action_handover

  # =========================
  # UX helper intents
  # =========================
  - rule: Rephrase prompt
    steps:
      - intent: rephrase
      - action: utter_rephrase_prompt

  - rule: Delete chat messages help
    steps:
      - intent: delete_chat_messages
      - action: utter_delete_chat_messages_help

  - rule: Edit last message help
    steps:
      - intent: edit_last_message
      - action: utter_edit_last_message_help

  # =========================
  # Explicit support request
  # =========================
  - rule: Submit support request explicitly
    steps:
      - intent: submit_support_request
      - action: utter_ticket_ack
      - action: action_create_support_request
      - action: utter_ticket_created

  # =========================
  # Fallback & ID Handling
  # =========================
  - rule: Process order ID (Confident)
    condition:
      - slot_was_set:
          - order_id: true
    steps:
      - intent: inform_order_id
      - action: action_check_order_status

  - rule: Implementation of the Two-Stage-Fallback
    steps:
      - intent: nlu_fallback
      - action: action_smart_fallback
