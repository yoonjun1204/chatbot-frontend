version: "3.1"

nlu:
  # ---------- regex (order_id) ----------
  - regex: order_id
    examples: |
      - \bORD-\d{3,}\b
      - \bSIM-\d{4}-\d{2}\b
      - \b[A-Z]{1,3}\d{3,}\b
      - \b\d{5,}\b

  # ---------- greet / goodbye / safety ----------
  - intent: greet
    examples: |
      - hi
      - hello
      - hey
      - good morning
      - good afternoon
      - good evening
      - hello there
      - hey support
      - hi chatbot
      - yo

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - thanks, bye
      - that's all, thank you
      - I am done
      - end the chat
      - you can close this now
      - exit
      - stop, thank you
      - ok thanks, goodbye

  - intent: bot_challenge
    examples: |
      - are you a bot
      - are you a real person
      - am I chatting with a human
      - are you an AI
      - is this automated
      - is this a chatbot
      - are you human
      - who am I talking to
      - what are you
      - are you a robot

  - intent: abusive
    examples: |
      - you are useless
      - this is stupid
      - shut up
      - you're dumb
      - this is garbage
      - you are wasting my time
      - nonsense
      - I hate this bot
      - you can't do anything
      - terrible service

  # ---------- session control ----------
  - intent: start_new_chat
    examples: |
      - start a new chat
      - new chat please
      - restart the conversation
      - can we start over
      - reset this chat
      - begin a new session
      - open a new support chat
      - I want to start a new session
      - clear the current chat and start again
      - let's start fresh

  # ---------- product / returns ----------
  - intent: product_info
    examples: |
      - tell me about your products
      - what products do you sell
      - do you have a catalogue
      - show me your product list
      - I want to know about your shirts
      - what sizes do you have
      - what materials are available
      - do you sell t-shirts
      - any new arrivals
      - can you recommend a product

  - intent: returns
    examples: |
      - what is your return policy
      - can I return an item
      - how do I exchange a product
      - I want to do a refund
      - can I get my money back
      - how long do I have to return
      - my item is damaged, can I return it
      - I received the wrong item, can I exchange
      - what are the refund steps
      - do you accept exchanges

  # ---------- order status (FORM) ----------
  - intent: check_order_status
    examples: |
      - where is my order
      - I want to track my order
      - check my order status
      - can you tell me the status of my order
      - is my order shipped yet
      - when will my order arrive
      - track delivery for my order
      - what is the progress of my order
      - help me check shipping status
      - I need an update on my order

  - intent: inform_order_id
    examples: |
      - my order id is [ORD-12345](order_id)
      - order number [12345](order_id)
      - it is [ORD-99881](order_id)
      - the order id: [A100200](order_id)
      - [ORD-00077](order_id)
      - it's for order [778899](order_id)
      - use [ORD-54321](order_id) please
      - tracking order [ORD-11223](order_id)
      - the id is [991122](order_id)
      - my order is [SIM-2026-01](order_id)

  - intent: update_order_details
    examples: |
      - sorry I gave the wrong order number, it should be [ORD-22222](order_id)
      - update the order id to [ORD-33333](order_id)
      - I want to change the order number to [123456](order_id)
      - correction: the order is [ORD-44444](order_id)
      - my new order number is [A90001](order_id)
      - please use [ORD-55555](order_id) instead
      - I typed it wrongly, the correct id is [ORD-66666](order_id)
      - replace my order id with [777888](order_id)
      - can you update the order id to [ORD-77777](order_id)
      - actually, my order number is [ORD-88888](order_id)

  # ---------- FAQ search (FORM-style pattern, but still intent-based) ----------
  - intent: search_faq
    examples: |
      - search the FAQ
      - can you check your FAQs
      - I want to find an FAQ answer
      - do you have an FAQ for this
      - help me look up your FAQ
      - find info in the FAQ
      - I want to search help articles
      - can you search your knowledge base
      - look up an FAQ for me
      - I need a quick FAQ answer

  - intent: inform_faq_query
    examples: |
      - search for [refund policy](search_term)
      - keyword [return](search_term)
      - look up [shipping time](search_term)
      - search [exchange](search_term)
      - try [warranty](search_term)
      - the topic is [late delivery](search_term)
      - I want info about [size chart](search_term)
      - please search [payment methods](search_term)
      - find [order cancellation](search_term)
      - query [wrong item received](search_term)

  # ---------- handover / ticket ----------
  - intent: human_handover
    examples: |
      - I want to talk to a human
      - can you connect me to an agent
      - escalate to human agent
      - let me speak to a real person
      - transfer me to support staff
      - I need a human assistant
      - please handover to an agent
      - human agent please
      - I want live support
      - this chatbot cannot help, get a human

  - intent: submit_support_request
    examples: |
      - I want to submit a support request
      - create a ticket for my issue
      - please open a case for me
      - log my enquiry as pending
      - submit my issue to support
      - raise a support request
      - file a request for help
      - can you create a support ticket
      - I want to track my enquiry with a request
      - please record my support request

  # ---------- chat history ----------
  - intent: request_chat_history
    examples: |
      - show my chat history
      - I want to see previous conversations
      - can I view my past chats
      - open earlier messages
      - let me check the conversation history
      - show me what we discussed before
      - display my previous chat log
      - I need to review old messages
      - where can I find my chat history
      - show prior conversation

  - intent: search_chat_history
    examples: |
      - search my chat history
      - find past messages
      - look for earlier replies
      - can you search my previous chats
      - locate old messages
      - search earlier answers
      - help me find an old conversation
      - find something from my past chats
      - search old chat records
      - look up past conversations

  - intent: inform_history_query
    examples: |
      - search my chat history for [refund](search_term)
      - find past messages about [shipping](search_term)
      - look for earlier replies on [return policy](search_term)
      - search previous chats for [ORD-12345](search_term)
      - find the conversation where we talked about [exchange](search_term)
      - search old chats using [late delivery](search_term)
      - can you search my history for [warranty](search_term)
      - locate messages mentioning [cancel order](search_term)
      - find my past chat about [wrong item](search_term)
      - search earlier answers for [payment](search_term)

  # ---------- rephrase / edit / privacy ----------
  - intent: rephrase
    examples: |
      - let me rephrase that
      - I will say it another way
      - I mean something else
      - sorry, I explained it badly
      - I want to clarify my question
      - that is not what I meant
      - you misunderstood me
      - I want to reword my request
      - let me clarify
      - I'll try again with different words

  - intent: delete_chat_messages
    examples: |
      - delete my messages
      - remove previous messages from my view
      - clear the chat on my screen
      - I want to delete the chat history on this page
      - erase the messages for privacy
      - can I remove the conversation from my view
      - clear chat messages
      - delete previous chat messages
      - remove old messages
      - wipe the chat display

  - intent: edit_last_message
    examples: |
      - I want to edit my last message
      - can I correct what I said
      - I made a typo, can I edit it
      - let me change my previous reply
      - I want to modify my last response
      - can I update the message I sent
      - I need to correct my enquiry
      - please allow me to edit what I submitted
      - I want to fix an error in my message
      - I need to revise my previous message