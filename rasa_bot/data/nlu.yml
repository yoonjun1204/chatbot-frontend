# rasa_bot/data/nlu.yml
version: "3.1"

nlu:
  # =======================
  # Regex
  # =======================
  - regex: order_id
    examples: |
      - \bORD-?\d{3,}\b
      - \bSIM-\d{4}-\d{2}\b
      - \b[A-Z]{1,3}\d{3,}\b
      - \b\d{5,}\b

  # =======================
  # greet
  # =======================
  - intent: greet
    examples: |
      - hi
      - hello
      - hey
      - hi there
      - hello there
      - good morning
      - good afternoon
      - good evening
      - greetings
      - good day

  # =======================
  # reset chat
  # =======================
  - intent: reset_chat
    examples: |
      - reset the conversation
      - clear this conversation
      - start the chat over
      - restart the session
      - wipe this chat history
      - I want to continue but reset

  # =======================
  # goodbye
  # =======================
  - intent: goodbye
    examples: |
      - I am leaving now
      - talk to you tomorrow
      - close the session
      - end the conversation
      - that is all for today
      - goodbye

  # =======================
  # bot_challenge
  # =======================
  - intent: bot_challenge
    examples: |
      - are you a robot or a person?
      - tell me your name
      - what kind of AI are you?
      - are you a computer program?
      - who are you?

  # =======================
  # abusive
  # =======================
  - intent: abusive
    examples: |
      - shut up you stupid bot
      - you are a useless piece of software
      - worst service ever
      - I hate this bot
      - you suck so much
      - this is frustrating
      - you are not helping at all
      - this system is useless
      - I'm really annoyed right now
      - this service is terrible
      - you are wasting my time

  # =======================
  # product_info
  # =======================
  - intent: product_info
    examples: |
      - tell me about your products
      - what products do you sell
      - show me your products
      - what do you offer
      - product information
      - do you sell electronics
      - what items are available
      - can I see your catalogue
      - what kind of products do you have
      - show product list
      - any products available
      - what can I buy here
      - what are your offerings
      - what goods do you sell
      - product details please
      - tell me about your items
      - list your products
      - available products
      - what services and products do you offer
      - do you have accessories
      - any new products
      - product recommendations
      - can you recommend something
      - what items can I purchase

  # =======================
  # returns
  # =======================
  - intent: returns
    examples: |
      - what is your return policy
      - can I return an item
      - how do returns work
      - refund policy
      - I want a refund
      - can I exchange an item
      - how do I return a product
      - return instructions
      - how long is the return period
      - can I get my money back
      - item return process
      - exchange policy
      - return conditions
      - refund process
      - how to exchange product
      - my item is damaged
      - wrong item received
      - return an order
      - refund my purchase
      - can I send this back
      - what if product is faulty
      - do you accept returns
      - exchange my order
      - return request

  # =======================
  # check_order_status
  # =======================
  - intent: check_order_status
    examples: |
      - where is my order
      - check my order status
      - track my order
      - order status please
      - can you track my order
      - I want to know my order status
      - is my order shipped
      - has my order been delivered
      - check delivery status
      - order tracking
      - where is my package
      - shipment status
      - track delivery
      - order progress
      - order update
      - I need order status
      - check shipping status
      - delivery update
      - when will my order arrive
      - has my order arrived
      - find my order
      - check order
      - order tracking status
      - shipment update

  # =======================
  # inform_order_id
  # =======================
  - intent: inform_order_id
    examples: |
      - my order id is [ORD-12345](order_id)
      - order number is [12345](order_id)
      - it is [ORD-99881](order_id)
      - [ORD-00077](order_id)
      - tracking [ORD-11223](order_id)
      - order id [SIM-2026-01](order_id)
      - the id is [991122](order_id)
      - use [ORD-54321](order_id)
      - [A100200](order_id)
      - order reference [778899](order_id)
      - my order is [ORD-22222](order_id)
      - here's my order id [ORD-33333](order_id)
      - check [ORD-44444](order_id)
      - order [ORD-55555](order_id)
      - id [ORD-66666](order_id)
      - order number [ORD-77777](order_id)
      - use order [ORD-88888](order_id)
      - reference [A90001](order_id)
      - tracking id [ORD-99999](order_id)
      - order code [123456](order_id)
      - [ORD-11111](order_id)
