version: "3.1"

nlu:
  # =======================
  # Regex
  # =======================
  - regex: order_id
    examples: |
      - \bORD-?\d{3,}\b
      - \bSIM-\d{4}-\d{2}\b
      - \b[A-Z]{1,3}\d{3,}\b
      - \b\d{5,}\b

  # =======================
  # greet
  # =======================
  - intent: greet
    examples: |
      - hi
      - hello
      - hey
      - hi there
      - hello there
      - good morning
      - good afternoon
      - good evening
      - greetings
      - good day

  # =======================
  # goodbye
  # =======================
  - intent: goodbye
    examples: |
      - I am leaving now
      - talk to you tomorrow
      - close the session
      - end the conversation
      - that is all for today
      - goodbye

