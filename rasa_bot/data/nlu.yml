  # =======================
  # update_order_details
  # =======================
  - intent: update_order_details
    examples: |
      - wrong order id
      - I made a mistake with the number
      - use [ORD-33333](order_id) instead
      - change my order id to [ORD-44444](order_id)
      - that was the wrong id, use [ORD-11111](order_id)
      - update it to [ORD-99999](order_id)
      - typo in my id

  # =======================
  # search_faq
  # =======================
  - intent: search_faq
    examples: |
      - search the faq for [refund](search_term)
      - look up [shipping](search_term) in the help center
      - check the faq about [warranty](search_term)
      - find documentation on [return policy](search_term)
      - help desk search for [delivery](search_term)

  # =======================
  # search_chat_history
  # =======================
  - intent: search_chat_history
    examples: |
      - search chat history
      - find past messages about [refund](search_term)
      - search old chats for [order status](search_term)
      - look up previous messages on [shipping](search_term)

  # =======================
  # human_handover
  # =======================
  - intent: human_handover
    examples: |
      - connect me to an agent
      - transfer to a person
      - switch to live support
      - speak to a representative
      - I need to talk to someone real

  # =======================
