    examples: |
      - create a support ticket
      - submit a support request
      - open a ticket
      - log a support request
      - raise a ticket
      - file a support request
      - open a case
      - submit my issue
      - create a case for me
      - record my request
      - submit a help request
      - raise an enquiry
      - log my issue
      - create support case
      - open support request
      - file an issue
      - submit issue to support
      - create service request
      - open customer support ticket
      - log a case

  # =======================
  # rephrase
  # =======================
  - intent: rephrase
    examples: |
      - let me rephrase that
      - that's not what I meant earlier
      - I want to explain my question differently
      - let me clarify my previous message
      - allow me to restate my question

  # =======================
  # edit_last_message
  # =======================
  - intent: edit_last_message
    examples: |
      - edit my previous message
      - fix a typo in what I just sent
      - change my last chat message
      - I want to correct my last reply
      - modify the message I just sent
