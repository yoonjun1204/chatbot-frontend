version: "3.1"

stories:
  # ========================================================
  # Happy Path: Check Order Status
  # ========================================================
  - story: Happy path - Check order status successfully
    steps:
      - intent: greet
      - action: utter_greet
      - intent: check_order_status
      - action: order_status_form
      - active_loop: order_status_form
      - slot_was_set:
          - requested_slot: order_id
      - intent: inform_order_id
        entities:
          - order_id: "ORD-12345"
      - slot_was_set:
          - order_id: "ORD-12345"
      - action: order_status_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_check_order_status
      - intent: goodbye
      - action: utter_goodbye

  # ========================================================
  # Happy Path: FAQ Search (Form Interaction)
  # ========================================================
  - story: Happy path - Search FAQ with form asking
    steps:
      - intent: search_faq
      - action: faq_search_form
      - active_loop: faq_search_form
      - intent: inform_faq_query
        entities:
          - search_term: "washing instructions"
      - slot_was_set:
          - search_term: "washing instructions"
      - action: faq_search_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_faq

  # ========================================================
  # Happy Path: FAQ Search (Skip Logic)
  # ========================================================
  - story: Happy path - Search FAQ with immediate entity
    steps:
      - intent: search_faq
        entities:
          - search_term: "return policy"
      - slot_was_set:
          - search_term: "return policy"
      - action: faq_search_form
      - active_loop: faq_search_form
      - action: faq_search_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_search_faq

  # ========================================================
  # Happy Path: Sales Brain
  # ========================================================
  - story: Sales Advice Conversation
    steps:
      - intent: ask_sales_advice
      - action: action_sales_brain
      - intent: ask_sales_advice
      - action: action_sales_brain

  # ========================================================
  # Context Switching: Order -> FAQ -> Human
  # ========================================================
  - story: Multi-task flow - Order to FAQ to Human
    steps:
      # 1. Start Order Form
      - intent: check_order_status
      - action: order_status_form
      - active_loop: order_status_form

      # 2. User switches to FAQ
      # --- FIX: Match the "Interruption Rule" exactly ---
      - intent: search_faq
      - action: action_deactivate_loop # <--- Added this to match Rule
      - active_loop: null # <--- Added this to match Rule
      - action: faq_search_form
      - active_loop: faq_search_form

      - intent: inform_faq_query
        entities:
          - search_term: "cancel order"
      - action: faq_search_form
      - active_loop: null
      - action: action_search_faq

      # 3. Still not happy -> Handover
      - intent: human_handover
      - action: utter_handover_ack
      - action: action_create_support_request
      - action: action_handover
