# rasa_bot/domain.yml
version: "3.1"

intents:
  - greet
  - goodbye
  - bot_challenge
  - abusive
  - product_info
  - returns
  - check_order_status
  - inform_order_id
  - update_order_details
  - search_faq
  - inform_faq_query
  - human_handover
  - submit_support_request
  - rephrase
  - nlu_fallback
  - ask_sales_advice
  - ask_payment_methods

entities:
  - order_id
  - search_term

slots:
  order_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_id
      - type: from_text
        conditions:
          - active_loop: order_status_form
            requested_slot: order_id
        not_intent:
          - search_faq
          - ask_sales_advice
          - abusive
          - greet
          - goodbye

  # --- CUSTOMER CONTEXT SLOTS ---
  customer_style:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  customer_occasion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  customer_budget:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  search_term:
    type: text
    mappings:
      # PRIORITY 1: If the user provided it in the first sentence (Scenario B)
      - type: from_entity
        entity: search_term

      # PRIORITY 2: If the form is asking, take whatever text they type (Scenario A)
      - type: from_text
        conditions:
          - active_loop: faq_search_form
            requested_slot: search_term

  requested_slot:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  current_product_context:
    type: text
    influence_conversation: false # Just for memory, doesn't change story flow
    mappings:
      - type: custom

forms:
  order_status_form:
    required_slots:
      - order_id

  faq_search_form:
    required_slots:
      - search_term

responses:
  utter_greet:
    - text: "Welcome to The Shirt Studio! I'm Stitch, your personal style assistant. How can I help you dress for success today?"
    - text: "Hi there! Looking for a crisp work shirt, or something breezy for the weekend?"
    - text: "Hello! I'm here to help you navigate our collection of premium shirts. What are you looking for?"

  utter_goodbye:
    - text: "Goodbye! Stay stylish."
    - text: "Thanks for stopping by! We hope to see you again soon."
    - text: "Have a great day! Don't hesitate to come back if you need more fashion advice."

  utter_bot_identity:
    - text: "I am 'Stitch', an automated virtual assistant designed to help you find the perfect shirt and track your orders."
    - text: "I'm a virtual agent powered by AI. I can check stock, track orders, and give styling advice!"

  utter_abusive_warning:
    - text: "I'm trying my best to help you find what you need. Let's please keep the conversation respectful."
    - text: "We value respect here. Please refrain from using offensive language so I can assist you better."

  utter_product_info:
    - text: "We specialize in high-quality men's shirts. Our collection includes Formal Oxfords, Casual Linens, and Party Wear. Check the website for the full catalogue!"
    - text: "From the boardroom to the beach, we have a shirt for every occasion. We stock sizes XS to XXL in Slim and Regular fits."
    - text: "We sell shirts made from 100% organic cotton, Italian linen, and premium silk blends."

  utter_ask_order_id:
    - text: "I can definitely check that. Could you please provide your Order ID? (It usually looks like ORD-12345)"
    - text: "To track your shipment, I need your Order Number. Please type it below (e.g., ORD-99881)."
    - text: "What is the Order ID you are inquiring about?"

  utter_ask_faq_search_form_search_term:
    - text: "Sure—what topic regarding our shirts or policies would you like to search?"
    - text: "I'm listening. What specific question or keyword do you have for the FAQ?"

  utter_handover_ack:
    - text: "I see you have a complex issue. Let me connect you to a human style expert."
    - text: "I'm going to pass this conversation to a live agent who can assist you further."

  utter_ticket_ack:
    - text: "Understood. I'll open a support ticket for this issue."
    - text: "I'm logging this request with our customer care team right now."

  utter_ticket_created:
    - text: "Ticket created successfully! A support agent will email you shortly."
    - text: "Done. Your ticket number has been generated and sent to your email."

  utter_rephrase_prompt:
    - text: "I'm sorry, I didn't quite catch that. Could you rephrase your question?"
    - text: "My AI brain is a bit confused. Could you say that in a different way?"

  utter_fallback:
    - text: "I'm sorry, I didn't understand that. You can ask me to 'Check Order Status', 'Search FAQs', or ask for 'Sales Advice' on our shirts."
    - text: "I missed that. Try asking: 'Where is my order?' or 'Recommend a shirt for a wedding'."

  utter_default_feedback:
    - text: "I'm slightly confused. You can ask about shirt fabrics, returns, or track your package."

actions:
  # --- Active Business Logic ---
  - action_check_order_status
  - validate_order_status_form
  - action_create_support_request
  - action_handover
  - action_search_faq
  - action_sales_brain

  # --- Active Fallback Logic ---
  - action_llm_fallback

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
