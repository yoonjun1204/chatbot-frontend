# rasa_bot/config.yml
recipe: default.v1

assistant_id: 2026-jan-13-rasa_v1.0

language: en

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer # Keep this! It helps DIET see the pattern.
  - name: RegexEntityExtractor
    use_lookup_tables: True
    use_regexes: True
    use_word_boundaries: True

  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 3
    max_ngram: 5

  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
    entity_recognition: false # DIET handles all extraction
    excluded_entities:
      - order_id

  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.4

policies:
  - name: MemoizationPolicy
    max_history: 10

  - name: TEDPolicy
    max_history: 10
    epochs: 100
    constrain_similarities: true

  - name: UnexpecTEDIntentPolicy
    max_history: 10
    epochs: 100

  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_smart_fallback"
    enable_fallback_prediction: True
